[package]
name = "things-mcp"
version = "0.1.0"
edition = "2024"
description = "Headless Things Cloud client exposed as an MCP server"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bs58 = "0.5.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.4"
futures-util = "0.3.34"
getrandom = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "gzip",
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
] }
rmcp = { version = "3.9.0", features = ["transport-io", "schemars"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3"
